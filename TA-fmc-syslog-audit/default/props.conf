# TA-fmc-syslog-audit
# Search-time fields and CIM mapping for Cisco Secure Firewall Management Center (FMC) syslog:
#   cisco:fmc:audit   FMC audit log (syslog facility 13)    -> Authentication (logins), Change (config changes)
#   cisco:fmc:syslog  FMC system syslog, correlation alerts -> Alerts (correlation events only)
# Install on search heads only. Nothing here runs at index time.
#
# Note: Splunk evaluates all EVAL- settings in a stanza independently, so no EVAL below
# reads another EVAL's output. Each one works from the extracted fields only.

[cisco:fmc:audit]
# <110>Oct 22 18:42:45 {fmc_host}: IPRep.pl: csm_processes@Default User IP, Login, Login Success
# The user can itself contain "@" (jdoe@example.com@{fmc_src}): the split is at the last "@" before the first comma.
EXTRACT-fmc_audit = ^<\d+>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+(?<fmc_name>[\w.\-]+):\s+(?<fmc_process>[^:]+):\s+(?<user>[^,]+)@(?<fmc_src>[^@,]+),\s+(?<fmc_subsystem>[^,]+),\s+(?<fmc_message>.*?)(?:#012|#015)*\s*$
EXTRACT-fmc_audit_save = ,\s+Save Policy\s+(?<fmc_saved_policy>.+?)(?:#012|#015)*\s*$
EXTRACT-fmc_audit_deploy = ,\s+Policy Deployment to\s+(?<fmc_deploy_device>\S+)\s+-\s+(?<fmc_deploy_result>[A-Z]+)
EXTRACT-fmc_audit_rule = ,\s+(?<fmc_rule_change>Added|Removed|Changed)\s+"(?<fmc_rule_state>[^"]+)"\s+(?:to|from)\s+(?<fmc_rule_name>.+?)\s+\((?<fmc_rule_gid_sid>\d+:\d+)\)
EXTRACT-fmc_audit_update = ,\s+(?:Started|Completed) install of rule update\s+"(?<fmc_rule_update>[^"]+)"
EXTRACT-fmc_audit_api = ,\s+API,\s+(?<http_method>[A-Z]+)\s+(?<url>\S+)\s+(?<fmc_api_result>.*?)\s*\((?<status_code>\d{3})\)

EVAL-vendor = "Cisco"
EVAL-product = "Secure Firewall Management Center"
EVAL-vendor_product = "Cisco Secure Firewall Management Center"
EVAL-app = "fmc"
EVAL-dvc = host

# src only when the FMC logged an address ("Default User IP" and "localhost" mean an internal action)
EVAL-src = if(match(fmc_src, "^[0-9]{1,3}([.][0-9]{1,3}){3}$") OR match(fmc_src, "^[0-9A-Fa-f:]+:[0-9A-Fa-f:]+$"), fmc_src, null())
EVAL-user_type = if(in(user, "System", "Default User", "csm_processes"), "system", "user")

# fmc_category drives the eventtypes (and so the CIM tags):
#   authentication  Login subsystem
#   session         Logout, session expiry
#   change          saves, commits, intrusion rule changes, deployments, rule/SRU updates, API writes
#   api_read        API GET calls
#   activity        everything else (page views, reports, backups, task completions)
EVAL-fmc_category = case(fmc_subsystem=="Login", "authentication", fmc_subsystem=="Logout" OR fmc_subsystem=="Session Expiration", "session", isnotnull(fmc_deploy_device) OR isnotnull(fmc_rule_name) OR isnotnull(fmc_rule_update) OR fmc_subsystem=="SRU Install" OR match(fmc_message, "^Policy Committed") OR match(fmc_message, "^(Save|Add|Create|Delete|Remove|Edit|Modify|Update|Apply)( |$)") OR (fmc_subsystem=="API" AND in(http_method, "POST", "PUT", "PATCH", "DELETE")), "change", fmc_subsystem=="API", "api_read", true(), "activity")

EVAL-action = case(fmc_subsystem=="Login" AND match(fmc_message, "(?i)success"), "success", fmc_subsystem=="Login", "failure", isnotnull(fmc_deploy_device), "updated", isnotnull(fmc_rule_name), "modified", isnotnull(fmc_rule_update) OR fmc_subsystem=="SRU Install", "updated", match(fmc_message, "^Policy Committed"), "modified", fmc_subsystem=="API" AND http_method=="POST", "created", fmc_subsystem=="API" AND http_method=="DELETE", "deleted", fmc_subsystem=="API" AND in(http_method, "PUT", "PATCH"), "modified", fmc_subsystem=="API" AND http_method=="GET", "read", match(fmc_message, "^(Add|Create)( |$)"), "created", match(fmc_message, "^(Delete|Remove)( |$)"), "deleted", match(fmc_message, "^(Save|Edit|Modify|Update|Apply)( |$)"), "modified")

EVAL-status = case(fmc_subsystem=="Login", if(match(fmc_message, "(?i)success"), "success", "failure"), isnotnull(fmc_deploy_result), if(fmc_deploy_result=="SUCCESS", "success", "failure"), isnotnull(status_code), if(tonumber(status_code) < 400, "success", "failure"), match(fmc_message, "(?i)(fail|error)"), "failure", true(), "success")

EVAL-change_type = case(isnotnull(fmc_deploy_device), "deployment", isnotnull(fmc_rule_update) OR fmc_subsystem=="SRU Install", "rule_update", isnotnull(fmc_rule_name) OR match(fmc_message, "^Policy Committed") OR match(fmc_message, "^(Save|Add|Create|Delete|Remove|Edit|Modify|Update|Apply)( |$)") OR (fmc_subsystem=="API" AND in(http_method, "POST", "PUT", "PATCH", "DELETE")), "configuration")

EVAL-object = case(isnotnull(fmc_deploy_device), fmc_deploy_device, isnotnull(fmc_rule_name), fmc_rule_name . " (" . fmc_rule_gid_sid . ")", isnotnull(fmc_saved_policy), fmc_saved_policy, isnotnull(fmc_rule_update), fmc_rule_update, isnotnull(url), replace(url, "^https?://[^/]+", ""), isnotnull(fmc_subsystem), mvindex(split(fmc_subsystem, " > "), -1))

EVAL-object_category = case(isnotnull(fmc_deploy_device), "device", isnotnull(fmc_rule_name), "intrusion_rule", isnotnull(fmc_rule_update) OR fmc_subsystem=="SRU Install", "rule_update", fmc_subsystem=="API", "api", match(fmc_subsystem, "^Policies > Intrusion"), "intrusion_policy", match(fmc_subsystem, "^Policies > Network Analysis"), "network_analysis_policy", match(fmc_subsystem, "^Policies > Access Control"), "access_control_policy", match(fmc_subsystem, "^Devices > Platform Settings"), "platform_settings", match(fmc_subsystem, "^Devices > "), "device", match(fmc_subsystem, "Scheduling"), "scheduled_task", isnotnull(fmc_subsystem), "fmc")

EVAL-object_path = fmc_subsystem
EVAL-object_attrs = fmc_rule_state
EVAL-command = if(isnotnull(http_method), http_method . " " . replace(url, "^https?://[^/]+", ""), null())
EVAL-result = fmc_message
EVAL-signature = fmc_message
# The target: the FTD device for a deployment, otherwise the FMC itself
EVAL-dest = if(isnotnull(fmc_deploy_device), fmc_deploy_device, host)


[cisco:fmc:syslog]
EXTRACT-syslog_pri = ^<(?<syslog_pri>\d+)>
# <41>Oct 22 19:55:45 {fmc_host} {process}: Correlation Event: {rule}/{policy} at Thu Oct 22 19:55:45 2026 UTCConnection Type: FireSIGHT {src}:59929 (unknown) -> {dest}:443 (united states) (tcp)
EXTRACT-fmc_correlation = Correlation Event:\s+(?<fmc_correlation_rule>[^/]+)/(?<fmc_correlation_policy>.+?)\s+at\s+\w{3}\s+\w{3}\s+\d{1,2}\s+[\d:]+\s+\d{4}\s+UTC\s*Connection Type:\s+(?<fmc_connection_type>\S+)\s+(?<src>[^\s:]+):(?<src_port>\d+)\s+\((?<src_country>[^)]*)\)\s+->\s+(?<dest>[^\s:]+):(?<dest_port>\d+)\s+\((?<dest_country>[^)]*)\)\s+\((?<transport>[^)]+)\)

EVAL-vendor = "Cisco"
EVAL-product = "Secure Firewall Management Center"
EVAL-vendor_product = "Cisco Secure Firewall Management Center"
EVAL-app = "fmc"
EVAL-dvc = host
EVAL-signature = fmc_correlation_rule
EVAL-type = if(isnotnull(fmc_correlation_rule), "alarm", null())
EVAL-description = if(isnotnull(fmc_correlation_rule), "FMC correlation rule " . fmc_correlation_rule . " (policy " . fmc_correlation_policy . ")", null())
# Syslog severity (PRI mod 8): 0-2 critical, 3 high, 4 medium, 5 low, 6-7 informational
EVAL-severity = if(isnotnull(fmc_correlation_rule) AND isnotnull(syslog_pri), case(tonumber(syslog_pri) % 8 <= 2, "critical", tonumber(syslog_pri) % 8 == 3, "high", tonumber(syslog_pri) % 8 == 4, "medium", tonumber(syslog_pri) % 8 == 5, "low", true(), "informational"), null())
