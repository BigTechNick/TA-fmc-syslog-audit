# TA-fmc-syslog-audit

[cisco_fmc_audit]
search = sourcetype="cisco:fmc:audit"

[cisco_fmc_audit_authentication]
search = sourcetype="cisco:fmc:audit" fmc_category="authentication"

[cisco_fmc_audit_change]
search = sourcetype="cisco:fmc:audit" fmc_category="change"

[cisco_fmc_correlation]
search = sourcetype="cisco:fmc:syslog" fmc_correlation_rule=*
